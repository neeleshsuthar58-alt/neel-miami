<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101827">
  <title>NEEL - MIAMI UNDERWORLD V0.3</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="loading">Loading Miami...</div>
  <div id="hud">
    <header>NEEL MIAMI UNDERWORLD <span>V0.3</span></header>
    <div class="mission">
      <strong>$ <span id="cash">500</span></strong><br>
      <b>Mission 1: Meet Jason</b><br>
      <small>Explore the expanded city with Jason.</small>
    </div>
    <div id="speed">0 km/h</div>
    <canvas id="minimap" width="180" height="180" aria-label="Minimap"></canvas>
    <div class="controls">
      <button id="jump">JUMP</button>
      <button id="action">ACTION</button>
      <button id="phone">PHONE</button>
      <button id="camera">CAM</button>
    </div>
    <div id="phonePanel" class="hidden">
      <b>NEEL'S PHONE</b>
      <button id="closePhone">✕</button>
      <p>CONTACTS　 GPS　 MISSIONS</p>
      <p id="phoneText">GPS: Explore Miami and meet Jason.</p>
    </div>
    <div id="message">Explore the city and find Jason.</div>
  </div>
  <script type="module" src="./game.js"></script>
</body>
</html>
